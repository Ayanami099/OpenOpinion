[project]
name = "openopinion"
version = "0.1.0"
description = "Stage-1 prompt/rule event and public-opinion speed-read agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=48.0.1",
  "jinja2>=3.1.6",
  "matplotlib>=3.8",
  "opencv-python>=4.13.0.92",
  "playwright>=1.60.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.34.2",
  "torch>=2.12.0",
  "transformers>=5.10.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
opinion-agent = "opinion_agent.cli:main"
openopinion-text-analysis = "openopinion_text_analysis.text_analysis_tool:main"
openopinion-run-topic = "openopinion_case_runner.cli:main"
openopinion-build-text-input = "openopinion_text_analysis.input_builder:main"
openopinion-local-text-analysis = "openopinion_text_analysis.local_text_analysis:main"
openopinion-build-report-context = "openopinion_report_enhancer.report_context_builder:main"
openopinion-generate-report-insights = "openopinion_report_enhancer.report_insights_generator:main"
openopinion-render-final-report = "openopinion_report_enhancer.final_report_renderer:main"
openopinion-analyze-text-input = "openopinion_text_analysis.text_input_analysis_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/opinion_agent",
  "src/openopinion_report_enhancer",
  "src/openopinion_text_analysis",
  "src/openopinion_case_runner",
  "src/campus_opinion_agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
